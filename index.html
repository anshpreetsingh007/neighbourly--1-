    <!-- The stylesheet names DM Sans and Syne but nothing ever loaded them, so
         every heading fell back to the browser's default sans. Only the weights
         actually used are requested, and display=swap paints text immediately
         in the fallback rather than leaving it invisible while the font
         downloads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap"
    />
